name: Sync wild creatures

# Once a week, crawl every repo tagged dsh-plugin into data/wild.json, then check which of them are
# really installable (data/bundles.json). A change is committed and the Deploy workflow is started,
# so new plugins appear in the ocean on their own.
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start the Deploy workflow

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/sync-wild.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check which repos declare a DSH bundle
        run: node scripts/sync-bundles.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed, then deploy
        run: |
          git add data/wild.json data/bundles.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "dshsea-bot"
          git config user.email "bot@dshsea.com"
          git commit -m "chore: sync wild creatures"
          git push
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
