name: Sync wild creatures

# Once a week, crawl every repo tagged dsh-plugin into data/wild.json.
# The commit triggers a rebuild, so new plugins appear in the ocean on their own.
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/sync-wild.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet data/wild.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "dshsea-bot"
          git config user.email "bot@dshsea.com"
          git add data/wild.json
          git commit -m "chore: sync wild creatures"
          git push
